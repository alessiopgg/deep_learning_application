name: DLA2026_clean

channels:
  - conda-forge

dependencies:
  - python=3.12.13
  - pip
  - pip:
      # Tested PyTorch CUDA build used for the laboratory
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.13.0+cu126
      - torchvision==0.28.0+cu126

      # Scientific Python stack
      - numpy==2.5.1
      - pandas==3.0.3
      - matplotlib==3.11.0
      - scikit-learn==1.9.0
      - Pillow==12.2.0

      # Configuration and experiment tracking
      - omegaconf==2.3.1
      - wandb==0.28.1

      # Exercise 3: detection dataset and evaluation
      - datasets==3.6.0
      - torchmetrics==1.9.0
      - faster-coco-eval==1.7.2

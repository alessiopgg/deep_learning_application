name: DLA2026-transformers

channels:
  - conda-forge

dependencies:
  - python=3.12.13
  - pip
  - pip:
      # Tested PyTorch CUDA build used for the laboratory
      - --extra-index-url https://download.pytorch.org/whl/cu126
      - torch==2.12.0+cu126

      # Scientific Python stack
      - numpy==2.4.4
      - pandas==3.0.5
      - matplotlib==3.11.1
      - scikit-learn==1.9.0
      - Pillow==12.2.0
      - joblib==1.5.3

      # Hugging Face Transformer ecosystem
      - datasets==5.0.1
      - transformers==5.14.1
      - accelerate==1.14.0

      # Experiment tracking
      - wandb==0.28.1

      # Exercise 3: interactive retrieval application
      - gradio==6.22.0
